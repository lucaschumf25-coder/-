<!doctype html>
<meta charset="utf-8">
<title>啵比 AR QR 產生器</title>
<style>body{font-family:system-ui;padding:32px;max-width:700px;margin:auto}input,button{font:inherit;padding:12px}input{width:100%;margin:12px 0}img{display:block;margin-top:20px;max-width:320px}</style>
<h1>啵比 AR QR Code</h1>
<p>請貼上專案部署完成後的 HTTPS 網址。</p>
<input id="url" placeholder="https://你的網址/">
<button onclick="make()">產生 QR</button>
<img id="qr">
<script>
function make(){
 const u=document.getElementById('url').value.trim();
 if(!u.startsWith('https://')) return alert('請輸入 HTTPS 網址');
 document.getElementById('qr').src='https://quickchart.io/qr?size=700&text='+encodeURIComponent(u);
}
</script>
